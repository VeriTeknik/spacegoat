# What a dependency of the hub agent may be.
[graph]
targets = [
    "aarch64-unknown-linux-musl",
    "armv7-unknown-linux-musleabihf",
    "x86_64-unknown-linux-musl",
]

[advisories]
yanked = "deny"

[licenses]
# Licences that may be linked into an AGPL-3.0-or-later binary.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # The Mozilla root certificate list compiled into the binary (webpki-roots, via ureq's `rustls` feature) is data
    # under the Community Data License Agreement, Permissive 2.0.
    "CDLA-Permissive-2.0",
]

# The hub crate itself is AGPL-3.0-or-later and not published (`publish = false`): its own licence is not judged
# against the list above, which is about what may be linked into it.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
